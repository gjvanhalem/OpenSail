# OpenSail: the built PWA, plus the chart archives mounted at /charts.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Chart archives and their catalog, from the volume. nginx answers Range
    # requests for static files, which PMTiles needs. Check for a newer edition
    # every time, but let the browser revalidate instead of downloading again.
    location /charts/ {
        alias /charts/;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
    }

    # The service worker and its manifest must never be cached, or users keep an old version
    location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Built files have a content hash in their name
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Client-side routes (/chart, /routes, ...) all load the app
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
