[package]
name = "opensail-desktop"
# The app's version is pwa/package.json (tauri.conf.json reads it), see docs/RELEASING.md
version = "0.0.0"
description = "OpenSail marine navigation for Windows"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
