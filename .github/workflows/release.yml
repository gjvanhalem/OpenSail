name: Release
# One tag, one GitHub release with both native apps (docs/RELEASING.md):
#   v0.2.0 → OpenSail_0.2.0_x64-setup.exe (Windows) and OpenSail-0.2.0.apk (Android)
# The tag must match the version in pwa/package.json, the one version of every app.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    name: Tag matches pwa/package.json
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION=$(node -p 'require("./pwa/package.json").version')
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME but pwa/package.json has $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    uses: ./.github/workflows/desktop.yml

  android:
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets: inherit

  publish:
    name: GitHub release
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opensail-desktop-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: opensail-android-release
          path: dist
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          name: OpenSail ${{ needs.version.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            dist/*-setup.exe
            dist/*.apk
          body: |
            OpenSail ${{ needs.version.outputs.version }} for Windows and Android. Not for navigation.

            - **Windows:** `OpenSail_${{ needs.version.outputs.version }}_x64-setup.exe`. Not code-signed yet: SmartScreen warns on first run ("More info" → "Run anyway"). See [desktop/README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/desktop/README.md).
            - **Android:** `OpenSail-${{ needs.version.outputs.version }}.apk`. Install by hand: allow installing from your browser or file manager when Android asks. Updates install over the previous version. See [android/README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/android/README.md).

            Both connect directly to the autopilot over Wi-Fi (Instruments › Wi-Fi, `192.168.14.1:20220`) and read the charts from [opensail-charts](https://github.com/gjvanhalem/opensail-charts).
