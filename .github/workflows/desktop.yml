name: Desktop app
# OpenSail for Windows (desktop/, Tauri 2). Rust only runs here, not on the dev laptop.
# Pull requests and main: check, test and build the installer. Tags desktop-v*: also publish it.
on:
  pull_request:
    paths: ['desktop/**', 'pwa/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/**', 'pwa/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write # to attach the installer to a release on desktop-v* tags

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      # generate_context! embeds the frontend, so it has to exist; this job doesn't need the real one
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p ../../pwa/dist && echo '<!doctype html>' > ../../pwa/dist/index.html
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    name: Installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            pwa/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          [ "desktop-v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but tauri.conf.json has $VERSION"; exit 1; }

      - run: npm ci
        working-directory: pwa
      - run: npm ci
      # Builds ../pwa with --mode native (beforeBuildCommand), then the app and the NSIS installer
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: opensail-desktop-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenSail for Windows ${{ github.ref_name }}
          body: |
            Windows installer for OpenSail. Not signed yet: Windows SmartScreen warns on first run ("More info" → "Run anyway").
            See desktop/README.md for install and connecting to the autopilot. Not for navigation.
          files: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe

      # The installer brings WebView2 along on machines without it; the runner needs it to start the app
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $version) {
            Write-Host 'WebView2 runtime missing, installing it'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2.exe"
            Start-Process "$env:RUNNER_TEMP\webview2.exe" -ArgumentList '/silent','/install' -Wait
            $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          }
          Write-Host "WebView2 runtime: $version"
      # Start the built app and drive it over WebView2's DevTools port (desktop/smoke)
      - name: Smoke test
        run: npm run smoke -- smoke-output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: desktop/smoke-output
          if-no-files-found: ignore
