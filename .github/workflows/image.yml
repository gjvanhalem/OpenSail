name: Container images
# The web app image (served from the Zimablade) and the chart pipeline image.
on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'tools/enc-pipeline/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Web app
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # Zimablade (Intel)
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opensail:latest
            ghcr.io/${{ github.repository_owner }}/opensail:${{ github.sha }}
          cache-from: type=gha,scope=opensail
          cache-to: type=gha,mode=max,scope=opensail

      - name: Chart pipeline
        uses: docker/build-push-action@v6
        with:
          context: tools/enc-pipeline
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opensail-enc-pipeline:latest
            ghcr.io/${{ github.repository_owner }}/opensail-enc-pipeline:${{ github.sha }}
          cache-from: type=gha,scope=enc-pipeline
          cache-to: type=gha,mode=max,scope=enc-pipeline
