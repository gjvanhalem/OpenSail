name: PWA Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - '.github/workflows/pwa-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pwa/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build and test job
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pwa/package-lock.json
      
      - name: Install dependencies
        run: |
          cd pwa
          npm ci
      
      - name: Run linter
        run: |
          cd pwa
          npm run lint
      
      - name: Run type check
        run: |
          cd pwa
          npx tsc -b
      
      - name: Run unit tests
        run: |
          cd pwa
          npm run test
      
      - name: Install Playwright browsers
        run: |
          cd pwa
          npx playwright install --with-deps chromium
      
      - name: Build application
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN || 'pk.test.placeholder' }}
        run: |
          cd pwa
          npm run build
      
      - name: Run E2E tests
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN || 'pk.test.placeholder' }}
        run: |
          cd pwa
          npm run test:e2e:chromium
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pwa/playwright-report/
          retention-days: 7
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-build
          path: pwa/dist/
          retention-days: 7
      
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/dist

  # Lighthouse audit job
  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: pwa-build
          path: pwa/dist
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli
      
      - name: Run Lighthouse CI
        run: |
          cd pwa
          lhci autorun --config=../lighthouserc.json || echo "Lighthouse audit completed with warnings"
      
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 7

  # Deploy to GitHub Pages: manual only (Actions > Run workflow) until hosting is decided
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
