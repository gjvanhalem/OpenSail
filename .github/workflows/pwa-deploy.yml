name: Web app
# The shared frontend (pwa/), the accounts server (server/) and the OpenSail bridge.
# Pull requests and main that touch them: lint, types, unit tests, server and bridge tests,
# Playwright (chromium, accounts) and a build. Lighthouse runs on manual runs only.

on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - 'server/**'
      - 'tools/opensail-bridge/**'
      - '.github/workflows/pwa-deploy.yml'
  # Any base branch, so stacked PRs get normal checks too
  pull_request:
    paths:
      - 'pwa/**'
      - 'server/**'
      - 'tools/opensail-bridge/**'
      - '.github/workflows/pwa-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build and test job
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One run per branch/PR ref: a new push cancels the older run on the same ref only
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pwa/package-lock.json
      
      - name: Install dependencies
        run: |
          cd pwa
          npm ci
      
      - name: Run linter
        run: |
          cd pwa
          npm run lint
      
      - name: Run type check
        run: |
          cd pwa
          npx tsc -b
      
      - name: Run unit tests
        run: |
          cd pwa
          npm run test
      
      - name: Test the OpenSail bridge
        run: node --test tools/opensail-bridge/bridge.test.mjs

      - name: Type check and test the OpenSail server (accounts)
        run: |
          pwa/node_modules/.bin/tsc -p server/tsconfig.json
          node --test server/server.test.ts

      - name: Install Playwright browsers
        run: |
          cd pwa
          npx playwright install --with-deps chromium
      
      - name: Build application
        run: |
          cd pwa
          npm run build
      
      - name: Run E2E tests
        run: |
          cd pwa
          npx playwright test --project=chromium --project=accounts
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pwa/playwright-report/
          retention-days: 7
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-build
          path: pwa/dist/
          retention-days: 7

  # Lighthouse audit job
  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-test
    # Manual runs only, to save Actions minutes
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: pwa-build
          path: pwa/dist
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli
      
      - name: Run Lighthouse CI
        run: |
          cd pwa
          lhci autorun --config=../lighthouserc.json || echo "Lighthouse audit completed with warnings"
      
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 7
