name: Android app
# OpenSail for Android (android/, Capacitor 8). The Android SDK and JDK only run here, not on
# the dev laptop. Pull requests and main: Kotlin unit tests, the debug APK (artifact
# opensail-android-debug), an unsigned release build and a smoke test on an emulator.
# Release tags v*: release.yml calls this workflow with release: true, which signs the release
# APK with the key in the ANDROID_KEYSTORE_* secrets (artifact opensail-android-release).
on:
  pull_request:
    paths: ['android/**', 'pwa/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'pwa/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      repeat:
        description: Run the emulator smoke test this many times in parallel (1 or 3), to check it is reliable
        type: choice
        options: ['1', '3']
        default: '1'
  workflow_call:
    inputs:
      release:
        description: Sign the release APK and upload it as opensail-android-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: APK (Kotlin tests, debug and release build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            pwa/package-lock.json
            android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: android/native/**/*.gradle*

      - run: npm ci
        working-directory: pwa
      - run: npm ci
      # Builds ../pwa with --mode native and copies it and the plugins into native/
      - run: npm run sync

      - name: Release key
        if: inputs.release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing (docs/RELEASING.md)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Kotlin tests, debug and release APK
        working-directory: android/native
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: opensail-android-debug
          path: android/native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Signed release APK
        if: inputs.release
        run: |
          VERSION=$(node -p 'require("../pwa/package.json").version')
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          mkdir -p release
          cp native/app/build/outputs/apk/release/app-release.apk "release/OpenSail-$VERSION.apk"
          "$APKSIGNER" verify --print-certs "release/OpenSail-$VERSION.apk"
      - if: inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: opensail-android-release
          path: android/release/*.apk
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: android/native/app/build/reports/tests
          if-no-files-found: ignore

  smoke:
    name: Smoke test (emulator)${{ inputs.repeat == '3' && format(' {0}', matrix.run) || '' }}
    needs: apk
    runs-on: ubuntu-latest
    # Boot takes up to 5 minutes; smoke.mjs gives up after 15 minutes and names the step that hung
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(inputs.repeat == '3' && '[1, 2, 3]' || '[1]') }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: android/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: opensail-android-debug
          path: android/apk
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Google's Automated Test Device image with Google APIs: @capacitor/geolocation reads Google
      # Play services' fused location, and the full google_apis image is too heavy for the runner
      # (Play services froze, so GPS stopped, in some runs)
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          # The default device: a small phone screen (320 x 640), so the smoke test uses the phone
          # layout (navigation behind the menu). Larger profiles are too slow with software rendering.
          disable-animations: true
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 600
          # A cold boot every time (no snapshot to load or save), so every run starts the same way
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            adb emu geo fix 5.3597 52.8846
            mkdir -p smoke-output && (adb logcat -v time > smoke-output/logcat.txt &) && node smoke/smoke.mjs apk/app-debug.apk smoke-output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-output${{ inputs.repeat == '3' && format('-{0}', matrix.run) || '' }}
          path: android/smoke-output
          if-no-files-found: ignore
