name: Chart pipeline image
# ghcr.io/<owner>/opensail-enc-pipeline (GDAL + tippecanoe), used by the opensail-charts repo and the
# Zimablade's `charts` tool. Heavy to build, so only when the pipeline itself changes.
on:
  push:
    branches: [main]
    paths:
      - 'tools/enc-pipeline/**'
      - '.github/workflows/pipeline-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Chart pipeline
        uses: docker/build-push-action@v6
        with:
          context: tools/enc-pipeline
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opensail-enc-pipeline:latest
            ghcr.io/${{ github.repository_owner }}/opensail-enc-pipeline:${{ github.sha }}
          cache-from: type=gha,scope=enc-pipeline
          cache-to: type=gha,mode=max,scope=enc-pipeline
